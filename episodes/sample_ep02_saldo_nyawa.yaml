scenes:
  - scene_number: 1
    beat: "hook"
    duration_seconds: 6
    characters:
      - "@Dika"
      - "@MbaKasir"
    location: "@KasirMinimarket"
    narration_id: "Di dunia ini, tinggi badan kamu otomatis berubah ngikutin sisa saldo e-wallet kamu."
    visual_prompt: "At @KasirMinimarket, tall proud @Dika stands comfortably over the checkout counter holding an iced coffee cup, flexing his smartphone toward the QR stand while @MbaKasir watches with a bored deadpan stare."
    camera: "medium vertical shot framing both @Dika and @MbaKasir across the counter"
    audio_sfx: "bright convenience store door chime, confident swagger pop"

  - scene_number: 2
    beat: "escalation"
    duration_seconds: 6
    characters:
      - "@Dika"
      - "@MbaKasir"
    location: "@KasirMinimarket"
    narration_id: "Tanggal dua puluh lima, Dika masih gaya beli kopi kekinian pakai QRIS tanpa ngecek saldo."
    visual_prompt: "At @KasirMinimarket, @Dika smoothly scans the QR payment stand with his glowing phone; a bright green checkout flash triggers and @MbaKasir taps the register while @Dika grins proudly."
    camera: "tight vertical over-the-shoulder shot on @Dika scanning the QR stand with @MbaKasir in background"
    audio_sfx: "QR scan beep, cash register cha-ching, suspicious descending synth"

  - scene_number: 3
    beat: "twist"
    duration_seconds: 6
    characters:
      - "@Dika"
    location: "@LantaiMinimarket"
    narration_id: "Begitu saldo sisa dua ribu perak, badan Dika langsung nyusut jadi seukuran tutup botol di lantai."
    visual_prompt: "On @LantaiMinimarket, @Dika rapidly shrinks with a comical cartoon squash effect until he is tiny as a plastic keychain standing next to a gigantic shopping basket and towering snack shelves, staring up in silent panic."
    camera: "dramatic vertical crane drop down to floor level beside tiny @Dika"
    audio_sfx: "cartoon shrinking slide whistle, tiny rubber squeak"

  - scene_number: 4
    beat: "outro"
    duration_seconds: 6
    characters:
      - "@Dika"
      - "@MbaKasir"
    location: "@KasirMinimarket"
    narration_id: "Sekarang Dika harus naik sedotan buat ngambil kopinya sendiri. Saldo kamu hari ini setinggi apa?"
    visual_prompt: "Back on the counter of @KasirMinimarket, @MbaKasir calmly places tiny thumb-sized @Dika on top of the iced coffee lid while @Dika hugs the giant plastic straw like a tree trunk with a deadpan face."
    camera: "close-up vertical hero shot of tiny @Dika hugging the straw while @MbaKasir leans on the counter behind"
    audio_sfx: "gentle straw slurp, deadpan comedic rimshot sting"
